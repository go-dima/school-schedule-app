# Publishes the interactive app-flow graph (scripts/gen-app-flow.ts --html)
# to GitHub Pages: https://go-dima.github.io/school-schedule-app/
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: App flow (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/gen-app-flow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/app-flow-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: app-flow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Also rewrites docs/app-flow.md/.svg in the runner; nothing is committed.
      - name: Generate the interactive page
        run: npm run docs:app-flow -- --html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
